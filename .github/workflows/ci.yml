# CI é quality-only: lint + typecheck + test + build + contraste. NÃO faz deploy.
# Deploy da apps/api é passo separado, fora daqui: Fly.io região GRU (São Paulo),
# máquina sempre ligada — processo Node de vida longa que o SSE do gestor de
# pedidos exige (Épico 9). Deploy dos fronts é a Vercel. Ver CLAUDE.md →
# "Infra de produção". Quando o deploy da API entrar no CI, é um job à parte.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `version:` — o pnpm/action-setup lê o campo `packageManager` do
      # package.json, então CI e máquina local nunca divergem.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - name: Auditoria de dependências
        run: pnpm audit --audit-level high --ignore-unfixable
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build

      # storybook-static (alvo do teste de contraste abaixo) saiu da task `build`
      # genérica de propósito: a Vercel roda `turbo run build` pro storefront/
      # backoffice, e `dependsOn: ["^build"]` arrastava o build do Storybook de
      # @molho/ui pra dentro do deploy dos fronts — algo que eles nunca consomem
      # (Next transpila o source cru de @molho/ui direto, via `transpilePackages`)
      # e que quebrava só na Vercel (devDependency do Storybook resolvida
      # diferente do ambiente local). Task separada (`build:storybook`), pedida
      # explicitamente aqui — nunca mais entra no grafo de build de um app.
      - run: pnpm --filter @molho/ui build:storybook

      # Regride em silêncio (config de build): falha se o atalho de auth só-dev
      # (dev-only-auth.ts) vazar pro bundle de produção do backoffice. Roda DEPOIS
      # do build — depende do .next/static. Ver docs/07.
      - name: Stub só-dev fora do bundle de produção
        run: ./scripts/check-dev-stub-excluded.sh

      - name: Cache dos browsers do Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instala o Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # Contraste real, medido no pixel: componente × tema × estado.
      # Pega a classe de bug que unit e axe não pegam (cor que some no merge de
      # classes, disabled ilegível, texto branco sobre cor clara demais).
      - name: Contraste (Chromium, 4 temas)
        run: pnpm test:contrast

      - name: Guarda o relatório quando reprova
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/ui/playwright-report/
          retention-days: 7
