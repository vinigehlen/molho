name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `version:` — o pnpm/action-setup lê o campo `packageManager` do
      # package.json, então CI e máquina local nunca divergem.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # `build` gera o storybook-static, que é o alvo do teste de contraste.
      - run: pnpm build

      - name: Cache dos browsers do Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instala o Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # Contraste real, medido no pixel: componente × tema × estado.
      # Pega a classe de bug que unit e axe não pegam (cor que some no merge de
      # classes, disabled ilegível, texto branco sobre cor clara demais).
      - name: Contraste (Chromium, 4 temas)
        run: pnpm test:contrast

      - name: Guarda o relatório quando reprova
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/ui/playwright-report/
          retention-days: 7
