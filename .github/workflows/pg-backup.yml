name: Backup noturno do Neon

on:
  schedule:
    # 03:17 America/Sao_Paulo (06:17 UTC). Minuto deslocado evita pico do cron.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg-backup-production
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: postgres:18-bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Instala cliente S3
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends awscli ca-certificates gzip
          rm -rf /var/lib/apt/lists/*

      - name: Executa dump e retenção
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: scripts/pg-backup.sh
