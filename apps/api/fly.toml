# DRAFT (Épico 9c) — NÃO validado contra deploy real. Ver docs/08-plano-9c.md.
# API do Molho: processo Node de vida longa (SSE + Redis pub/sub), São Paulo,
# DUAS máquinas sempre ligadas com rolling deploy. NUNCA scale-to-zero.

app = "molho-api-staging"    # staging (dev-local, descartável). `molho-api` fica reservado pro piloto.
                             # Nomes de app na Fly são GLOBAIS — se estiver tomado, avisar antes de improvisar.
                             # DNS correspondente: staging-api.molho.live (par com staging-app.molho.live).
primary_region = "gru"       # São Paulo — co-localizado com o Neon sa-east-1

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3333"
  NODE_ENV = "production"    # liga a guarda: boot falha sem ZENVIA_API_KEY real

[http_service]
  internal_port = 3333
  force_https = true
  # NUNCA scale-to-zero: máquina scale-to-zero não segura conexão SSE nem
  # subscriber de pub/sub (CLAUDE.md → Infra de produção).
  auto_stop_machines = false
  auto_start_machines = false
  # Duas sempre ligadas: rolling derruba UMA por vez, a outra segura os streams.
  min_machines_running = 2

  [http_service.concurrency]
    # Conexão longa (SSE), não request curta. Limites são ESTIMATIVA a MEDIR no
    # piloto (~1–2k SSE por 512MB, docs/08 passo 5) — não cap de produto.
    type = "connections"
    soft_limit = 1500
    hard_limit = 2000

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  strategy = "rolling"       # uma máquina por vez; a outra mantém os SSE vivos
  # Drain do SIGTERM: o graceful shutdown fecha os streams com server_shutdown e
  # completa (rápido), mas deixar folga. TODO(9c): confirmar que basta.
  # kill_timeout configurável no [[vm]]/serviço conforme a medição.

# Health check: hoje NÃO há endpoint /health (docs/08 passo 3). TCP na porta até
# existir um /health leve. TODO(9c): trocar por http check quando o endpoint entrar.
[[services.tcp_checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
