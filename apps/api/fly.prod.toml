# NG-12 — Fly PRODUTIVA do piloto. Cópia fiel de fly.toml (staging) com só o
# nome do app trocado. Manter os dois em sincronia nas mudanças de infra.
# API do Molho: processo Node de vida longa (SSE + Redis pub/sub), São Paulo,
# DUAS máquinas sempre ligadas com rolling deploy. NUNCA scale-to-zero.

app = "molho-api"            # PILOTO produtivo. Deploy da raiz: fly deploy . -c apps/api/fly.prod.toml
                             # Nomes de app na Fly são GLOBAIS. DNS: api.molho.live (cert criado sem apontar DNS).
primary_region = "gru"       # São Paulo — co-localizado com o Neon sa-east-1

[build]
  # ATENÇÃO: `dockerfile` é resolvido pela Fly RELATIVO A ESTE TOML (que vive em
  # apps/api/), NÃO à raiz do monorepo — por isso "Dockerfile" liso. Escrever
  # "apps/api/Dockerfile" aqui vira apps/api/apps/api/Dockerfile e o deploy falha.
  # O build CONTEXT é outra coisa: é o argumento posicional do comando, e TEM que
  # ser a raiz (o Dockerfile é multi-stage de workspace — COPY pnpm-workspace.yaml,
  # packages/db, packages/contracts). Deploy sempre, rodado da raiz:
  #   fly deploy . -c apps/api/fly.toml
  # (o `.` é o WORKING_DIRECTORY = build context; `-c` só aponta o TOML.)
  dockerfile = "Dockerfile"

[env]
  PORT = "3333"
  NODE_ENV = "production"
  # A guarda de produção do OTP é POR CANAL EM USO (messaging.module.ts):
  # com OTP_CHANNEL_STAFF/CUSTOMER = "email" (secrets), o boot exige
  # RESEND_API_KEY + MOLHO_EMAIL_FROM — e NÃO a ZENVIA_API_KEY.

[http_service]
  internal_port = 3333
  force_https = true
  # NUNCA scale-to-zero: máquina scale-to-zero não segura conexão SSE nem
  # subscriber de pub/sub (CLAUDE.md → Infra de produção).
  auto_stop_machines = false
  auto_start_machines = false
  # DUAS máquinas: rolling deploy derruba uma por vez, a outra segura os streams
  # SSE do gestor. Uma só mataria 100% dos streams a cada deploy.
  min_machines_running = 2

  # /health: resposta estática, não toca banco nem Redis — LIVENESS (o processo
  # está vivo?). grace curto, timeout curto: se travar, reinicia a máquina.
  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

  # /ready: toca banco + Redis, responde 503 se uma dependência obrigatória
  # está fora — READINESS (dá pra mandar tráfego?). Fly tira a máquina da
  # rotação do proxy sem matar o processo (streams SSE da outra máquina seguem
  # vivos). grace maior: no boot, esperar o pool do Prisma e o connect do Redis.
  # Ver apps/api/src/health/readiness.service.ts — NG-07.
  [[http_service.checks]]
    interval = "10s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/ready"

  [http_service.concurrency]
    # Conexão longa (SSE), não request curta. Limites são ESTIMATIVA a MEDIR no
    # piloto (~1–2k SSE por 512MB, docs/08 passo 5) — não cap de produto.
    type = "connections"
    soft_limit = 1500
    hard_limit = 2000

[[vm]]
  size = "shared-cpu-1x"
  # 512MB: 256MB não cabe — NestJS + engine do Prisma + pool pg passam de 200MB
  # no baseline, e o Node em cima disso OOMa (health check flapando, 2026-09-08).
  # A carga do piloto (~100 conexões SSE) sobra dentro de 512.
  memory = "512mb"

[deploy]
  strategy = "rolling"       # uma máquina por vez; a outra mantém os SSE vivos
  # Drain do SIGTERM: o graceful shutdown fecha os streams com server_shutdown e
  # completa (rápido), mas deixar folga. TODO(9c): confirmar que basta.
  # kill_timeout configurável no [[vm]]/serviço conforme a medição.
